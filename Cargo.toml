[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
authors = ["Chamfera contributors"]

[workspace.dependencies]
# internal (layer order: see docs/architecture.md)
chamfera-geom = { path = "crates/geom" }
chamfera-sketch = { path = "crates/sketch" }
chamfera-kernel = { path = "crates/kernel" }
chamfera-render = { path = "crates/render" }
chamfera-doc = { path = "crates/doc" }
chamfera-io = { path = "crates/io" }
chamfera-drawing = { path = "crates/drawing" }
chamfera-engine = { path = "crates/engine" }
chamfera-gpu = { path = "crates/gpu" }
chamfera-ui = { path = "crates/ui" }
chamfera-mcp = { path = "crates/mcp" }

# external: permissive licences only (deny.toml)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "0.9"

# GPU and UI (layers 5-6 only; `cargo xtask layers` enforces it)
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-wgpu = "0.37"
rfd = "0.17"
# Rasterises the interface icons (assets/icons/ui/*.svg) for egui: pure Rust, builds for wasm.
resvg = { version = "0.49", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Debug builds keep line numbers for backtraces but not full debug info: build folders are
# about half the size (each agent worktree has its own, and disk space is limited).
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (trunk, apps/chamfera-web/index.html): smallest code, whole-program LTO.
# Only trunk uses it, so desktop release builds stay as they are.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = "fat"
