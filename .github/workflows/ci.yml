name: ci

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    # An older LTS keeps the AppImage compatible with older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Software Vulkan (lavapipe), so the GPU snapshot test renders without a GPU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci
        env:
          # GPU tests must really render (on lavapipe here), not skip.
          CHAMFERA_REQUIRE_GPU: "1"

  web:
    # Pull requests run only the Linux ci job; this runs on pushes (dev, main, tags).
    if: github.event_name != 'pull_request'
    # The browser app: built with trunk, then started in headless Chrome (WebGL 2 on
    # SwiftShader), where every file path is exercised. On pushes to dev the build is kept
    # for the GitHub Pages deployment below.
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (trunk)
        working-directory: apps/chamfera-web
        run: |
          trunk build --release
          ls -l dist
          echo "wasm: $(stat -c %s dist/*.wasm) bytes, gzip $(gzip -9 -c dist/*.wasm | wc -c) bytes"
      - name: Smoke test in headless Chrome (WebGL 2)
        run: node tools/web-smoke.mjs --no-webgpu --out web-webgl2.png
      - name: Files in the browser (open, insert, save, export, local storage)
        run: node tools/web-smoke.mjs --no-webgpu --steps tools/web-checks/files.json
      - name: Smoke test with WebGPU (SwiftShader; informative only)
        continue-on-error: true
        run: node tools/web-smoke.mjs --renderer webgpu --out web-webgpu.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chamfera-web-screenshots
          path: "*.png"
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        with:
          path: apps/chamfera-web/dist

  pages:
    # Publishes the browser app from dev to GitHub Pages. Only pushes to dev in this
    # repository deploy: never pull requests (from forks or not), and never forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'Open-Physical-Systems/Chamfera'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  appimage:
    # Pull requests run only the Linux ci job; this runs on pushes (dev, main, tags).
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Icon tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: packaging/linux/build-appimage.sh
      - name: The AppImage starts (command-line mode)
        run: |
          APP=$(ls target/appimage/Chamfera-*-x86_64.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$APP" cli --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$APP" cli exec body.sample
      - uses: actions/upload-artifact@v4
        with:
          name: chamfera-appimage
          path: target/appimage/Chamfera-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    # Pull requests run only the Linux ci job; this runs on pushes (dev, main, tags).
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Icon and installer tools (ImageMagick, NSIS)
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) { choco install imagemagick -y --no-progress }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build the zip and the installer
        shell: pwsh
        run: |
          # choco puts new tools on PATH only for later shells; refresh it for this one.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + $env:Path
          ./packaging/windows/build-windows.ps1 -RequireInstaller
      - name: The zip runs
        shell: pwsh
        run: |
          $zip = Get-Item target/windows/Chamfera-*-windows-x86_64.zip
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP/zip"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP/zip" -Directory | Select-Object -First 1).FullName
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in "chamfera.exe", "chamfera-cli.exe", "LICENSE-MIT", "LICENSE-APACHE", "ATTRIBUTION.md") {
            if (-not (Test-Path "$dir/$f")) { throw "$f missing from the zip" }
          }
          & "$dir/chamfera-cli.exe" --version; if ($LASTEXITCODE -ne 0) { throw "cli --version failed" }
          & "$dir/chamfera-cli.exe" exec body.sample; if ($LASTEXITCODE -ne 0) { throw "cli exec failed" }
          # chamfera.exe is a GUI-subsystem app; capturing its output makes PowerShell wait for it.
          $v = (& "$dir/chamfera.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $v.StartsWith("chamfera ")) { throw "chamfera --version printed '$v'" }
          Write-Output $v
      - name: The installer installs, runs and uninstalls (silently)
        shell: pwsh
        run: |
          $setup = (Get-Item target/windows/Chamfera-*-windows-x86_64-setup.exe).FullName
          $dir = "$env:RUNNER_TEMP\installed"
          Start-Process -FilePath $setup -ArgumentList "/S", "/D=$dir" -Wait
          & "$dir\chamfera-cli.exe" --version; if ($LASTEXITCODE -ne 0) { throw "installed cli failed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Chamfera.lnk")) { throw "no Start menu shortcut" }
          Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait
          if (Test-Path "$dir\chamfera.exe") { throw "uninstall left chamfera.exe behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: chamfera-windows
          path: |
            target/windows/Chamfera-*-windows-x86_64.zip
            target/windows/Chamfera-*-windows-x86_64-setup.exe
          if-no-files-found: error

  macos:
    # Pull requests run only the Linux ci job; this runs on pushes (dev, main, tags).
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Icon tool (rsvg-convert)
        run: command -v rsvg-convert || brew install librsvg
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: packaging/macos/build-macos.sh
      - name: The disk image mounts and the app runs
        run: |
          DMG=$(ls target/macos/Chamfera-*-macos-universal.dmg)
          MNT="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          ls -la "$MNT" "$MNT/Chamfera.app/Contents/MacOS" "$MNT/Chamfera.app/Contents/Resources"
          for bin in chamfera chamfera-cli; do
            archs=$(lipo -archs "$MNT/Chamfera.app/Contents/MacOS/$bin")
            echo "$bin: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          done
          plutil -p "$MNT/Chamfera.app/Contents/Info.plist"
          "$MNT/Chamfera.app/Contents/MacOS/chamfera-cli" --version
          "$MNT/Chamfera.app/Contents/MacOS/chamfera-cli" exec body.sample
          v=$("$MNT/Chamfera.app/Contents/MacOS/chamfera" --version)
          echo "$v"
          [[ "$v" == "chamfera "* ]]
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v4
        with:
          name: chamfera-macos
          path: target/macos/Chamfera-*-macos-universal.dmg
          if-no-files-found: error

  release:
    # A tag vX.Y.Z (on main) publishes the AppImage, the Windows zip and installer, and the
    # macOS disk image as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chamfera-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            Chamfera-*-x86_64.AppImage \
            Chamfera-*-windows-x86_64.zip \
            Chamfera-*-windows-x86_64-setup.exe \
            Chamfera-*-macos-universal.dmg
