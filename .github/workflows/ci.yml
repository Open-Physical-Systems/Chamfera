name: ci

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    # An older LTS keeps the AppImage compatible with older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Software Vulkan (lavapipe), so the GPU snapshot test renders without a GPU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci
        env:
          # GPU tests must really render (on lavapipe here), not skip.
          CHAMFERA_REQUIRE_GPU: "1"

  appimage:
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Icon tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: packaging/linux/build-appimage.sh
      - name: The AppImage starts (command-line mode)
        run: |
          APP=$(ls target/appimage/Chamfera-*-x86_64.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$APP" cli --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$APP" cli exec body.sample
      - uses: actions/upload-artifact@v4
        with:
          name: chamfera-appimage
          path: target/appimage/Chamfera-*-x86_64.AppImage
          if-no-files-found: error

  release:
    # A tag vX.Y.Z (on main) publishes the AppImage as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chamfera-appimage
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Chamfera-*-x86_64.AppImage --repo "$GITHUB_REPOSITORY" --generate-notes
