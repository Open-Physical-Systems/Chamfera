# Licence and source rules. `cargo xtask licences` (part of `cargo xtask ci`) enforces them.
# Copyleft licences (GPL, LGPL, AGPL, MPL, EUPL, SSPL, ...) are not allowed: never add them here.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

# Font licences for the UI fonts egui bundles: Ubuntu Light (Ubuntu-font-1.0), Noto Emoji (OFL-1.1).
# They allow shipping the fonts inside an application. Allowed for this crate only, never for
# code. Credited in ATTRIBUTION.md.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
