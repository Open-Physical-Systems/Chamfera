[package]
name = "chamfera-web"
description = "Chamfera in the browser (WebAssembly)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
chamfera-ui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
# WebGPU where the browser has it, WebGL 2 as the fallback.
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "DomStringMap", "Element", "HtmlCanvasElement", "HtmlElement", "Location", "Window"] }
# Panics show their message in the browser console (MIT OR Apache-2.0).
console_error_panic_hook = "0.1"
log = "0.4"

[lints]
workspace = true
