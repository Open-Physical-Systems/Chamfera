<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chamfera</title>
  <meta name="description" content="Chamfera, an open-source parametric 3D CAD app, running in the browser.">
  <link data-trunk rel="icon" href="../../assets/icons/chamfera.svg" type="image/svg+xml">
  <link data-trunk rel="rust" data-wasm-opt="z" data-cargo-profile-release="web-release" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f7f9; color: #2b313b; }
    @media (prefers-color-scheme: dark) { html, body { background: #24272c; color: #d8dce2; } }
    /* eframe sizes the canvas's pixel buffer from its CSS size and devicePixelRatio. */
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               white-space: pre-line; text-align: center; padding: 16px;
               font: 15px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="chamfera"></canvas>
  <div id="loading">Loading Chamfera…</div>
</body>
</html>
